<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IB 真题库 · Past Paper Library</title>
<style>
:root{--bg:#0f1216;--panel:#161b22;--panel2:#1c232c;--line:#283040;--tx:#e6edf3;--mut:#8b98a9;--acc:#e4002b;--acc2:#3b82f6;--ok:#22c55e}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif}
a{color:var(--acc2);text-decoration:none}
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#11161d,#0f1216);border-bottom:1px solid var(--line);padding:12px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header h1{margin:0;font-size:18px;letter-spacing:.3px}
header .sub{color:var(--mut);font-size:12px}
#q{flex:1;min-width:220px;background:var(--panel2);border:1px solid var(--line);color:var(--tx);border-radius:22px;padding:9px 16px;font-size:14px;outline:none}
#q:focus{border-color:var(--acc2)}
.app{display:flex;height:calc(100% - 62px)}
aside{width:250px;min-width:250px;border-right:1px solid var(--line);overflow:auto;background:var(--panel)}
aside .h{padding:10px 14px;color:var(--mut);font-size:12px;position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line)}
.srow{padding:8px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #12171d}
.srow:hover{background:var(--panel2)}
.srow.on{background:#20304a;border-left:3px solid var(--acc2)}
.srow .c{color:var(--mut);font-size:12px}
main{flex:1;overflow:auto;padding:16px 20px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.card:hover{border-color:var(--acc2)}
.card b{font-size:15px}
.card .m{color:var(--mut);font-size:12px;margin-top:4px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar select,.bar button{background:var(--panel2);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px}
.bar button{cursor:pointer}
.bar button:hover{border-color:var(--acc2)}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #12171d;font-size:13px}
th{background:var(--panel2);color:var(--mut);font-weight:600;position:sticky;top:0}
tr:hover td{background:var(--panel2)}
.tag{display:inline-block;padding:1px 7px;border-radius:6px;font-size:11px;border:1px solid var(--line);color:var(--mut)}
.tag.ms{color:#f5c451;border-color:#5a4a1e;background:#2a2210}
.tag.paper{color:#7fd1a8;border-color:#1e4a35;background:#0f2a1e}
.tag.rep{color:#c58af9;border-color:#43265c;background:#221030}
.dl{color:var(--tx);background:transparent;font-family:inherit;border:1px solid var(--line);border-radius:8px;padding:3px 10px;font-size:12px;white-space:nowrap;cursor:pointer}
.dl:hover{background:var(--acc);border-color:var(--acc);color:#fff}
.hint{color:var(--mut);margin:6px 0 14px}
.ses{color:var(--mut)}
.hl{color:var(--tx);font-weight:600}
mark{background:#3b2a00;color:#ffd76a;padding:0 2px;border-radius:3px}
.qrmask{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:100}
.qrmask.on{display:flex}
.qrcard{background:#fff;color:#111;border-radius:16px;padding:18px 20px 16px;text-align:center;max-width:min(92vw,430px);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.qrcard h3{margin:0 0 12px;font-size:14px;color:#111;line-height:1.4}
.qrcard img{display:block;margin:0 auto;background:#fff}
.qrcard .t{font-size:12px;color:#555;margin-top:10px;word-break:break-all}
.qrcard button{margin-top:14px;background:#e4002b;color:#fff;border:0;border-radius:9px;padding:9px 20px;font-size:14px;cursor:pointer}
.qrcard a{display:inline-block;margin-top:10px;color:#0645ad;font-size:12px}
.qrsheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
.qitem{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.qitem .qt{font-size:11px;color:var(--tx);font-weight:600;margin-bottom:6px;line-height:1.35}
.qitem .qi img{background:#fff;padding:5px;border-radius:8px}
.qitem .qn{font-size:9px;color:var(--mut);margin-top:6px;word-break:break-all;line-height:1.3}
@media print{header,aside,.bar,footer,.hint{display:none!important}.app{display:block}main{overflow:visible;padding:0}.qitem{break-inside:avoid;border-color:#ccc}.qrsheet{grid-template-columns:repeat(4,1fr)}body{background:#fff;color:#000}}
footer{color:var(--mut);font-size:12px;padding:20px 4px}
</style>
</head>
<body>
<header>
  <h1>IB 真题库</h1>
  <span class="sub">共 <b id="tot">9087</b> 份 · 2020–2026 · 全学科 / 全 TZ / HL·SL · 来源 papers.xtremepape.rs · 本地离线</span>
  <input id="q" placeholder="搜索：科目 / HL / 2024 / paper 1 / markscheme …">
</header>
<div class="app">
  <aside><div class="h">科目（点击浏览）</div><div id="subs"></div></aside>
  <main id="main"></main>
</div>
<div id="qrmask" class="qrmask"><div class="qrcard">
  <h3 id="qrtitle">扫码打开评分标准</h3>
  <div id="qrimg"></div>
  <div class="t" id="qrtxt"></div>
  <div><a id="qrlink" href="#" target="_blank" rel="noopener">直接打开</a></div>
  <button id="qrclose">关闭</button>
</div></div>
<script src="vendor/qrcode.js"></script>
<script src="data.js"></script>
<script>
const P = window.PAPERS || [];
const MON = {may:5,november:11,nov:11,october:10,oct:10,march:3,february:2};
function sesKey(s){const m=/([A-Za-z]+)?\s*(\d{4})/.exec(s||"");if(!m)return 0;const y=+m[2]||0;const mo=MON[(m[1]||"").toLowerCase()]||(y===0?0:6);return y*100+mo;}
const bySub = {};
for(const r of P){ (bySub[r.s] ||= []).push(r); }
for(const k in bySub) bySub[k].sort((a,b)=> sesKey(b.ses)-sesKey(a.ses) || (a.l||"").localeCompare(b.l||"") || (a.pp||"").localeCompare(b.pp||"") || (a.k||"").localeCompare(b.k||""));
const subList = Object.keys(bySub).sort((a,b)=> bySub[b].length-bySub[a].length || a.localeCompare(b,"zh"));
const E = id => document.getElementById(id);
const esc = s => (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// ===== 扫码出 markscheme =====
const MS1={},MS2={},MS3={};
for(const r of P){ if(r.k==="markscheme"){
  const a=[r.s,r.ses,r.l,r.pp,r.tz].join("|"),b=[r.s,r.ses,r.l,r.pp].join("|"),c=[r.s,r.ses,r.pp].join("|");
  if(!MS1[a])MS1[a]=r; if(!MS2[b])MS2[b]=r; if(!MS3[c])MS3[c]=r;
}}
function msFor(r){
  if(r.k==="markscheme")return r;
  return MS1[[r.s,r.ses,r.l,r.pp,r.tz].join("|")] || MS2[[r.s,r.ses,r.l,r.pp].join("|")] || MS3[[r.s,r.ses,r.pp].join("|")] || null;
}
function qrImg(txt,cell){ try{ const q=qrcode(0,"M"); q.addData(txt); q.make(); return q.createImgTag(cell||4,4); }catch(e){ return '<div style="color:#c00;font-size:11px">QR 生成失败</div>'; } }
function showQR(r){
  const ms=msFor(r);
  E("qrtitle").textContent = ms ? ("扫码打开评分标准："+r.s+" · "+r.ses+" · "+(r.l||"")+(r.pp?(" · "+r.pp):"")) : "这份卷在库里没有对应评分标准";
  if(!ms){ E("qrimg").innerHTML=""; E("qrtxt").textContent=r.n||""; E("qrlink").style.display="none"; }
  else { E("qrimg").innerHTML=qrImg(ms.u,5); E("qrtxt").textContent=ms.n; E("qrlink").href=ms.u; E("qrlink").style.display="inline-block"; }
  E("qrmask").classList.add("on");
}
let CUR=[];
function openQrSheet(rows,title){
  const rich=rows.filter(r=>r.k!=="markscheme");
  const nm={paper:"试卷",report:"考官报告",specimen:"样卷"};
  E("main").innerHTML='<h2 style="margin:0 0 6px">'+esc(title)+' · 二维码小抄</h2>'
    +'<div class="hint">共 '+rich.length+' 张（可打印）——扫每张图上的码 → 直接跳到该卷的评分标准</div>'
    +'<div class="bar"><button id="qback">返回列表</button><button id="qprint">打印</button></div>'
    +'<div class="qrsheet">'+rich.map(r=>{const ms=msFor(r);
      return '<div class="qitem"><div class="qt">'+esc(r.s)+'<br>'+(r.tz?esc(r.tz)+" · ":"")+esc(r.ses)+(r.l?" · "+esc(r.l):"")+(r.pp?" · "+esc(r.pp):"")+'</div><div class="qi">'+(ms?qrImg(ms.u,3):'<span class="tag">无 MS</span>')+'</div><div class="qn">'+esc(r.n)+'</div></div>';}).join("")+'</div>'
    +'<footer>来源 papers.xtremepape.rs · 本地离线</footer>';
  E("qback").onclick=()=>open(title);
  E("qprint").onclick=()=>window.print();
  window.scrollTo(0,0);
}

function cardView(){
  E("main").innerHTML = '<div class="hint">选一个科目开始。数据来自 xtremepape.rs 的 IB 镜像（2020–2026），含试卷 + 评分标准，全 TZ、HL/SL。</div>'
   + '<div class="cards">' + subList.slice(0,400).map(s=>
     `<div class="card" data-s="${esc(s)}"><b>${esc(s)}</b><div class="m">${bySub[s].length} 份 · ${[...new Set(bySub[s].map(r=>r.ses))].length} 个考季</div></div>`).join("") + '</div>';
  E("main").querySelectorAll(".card").forEach(c=>c.onclick=()=>open(c.dataset.s));
  document.querySelectorAll(".srow").forEach(r=>r.classList.toggle("on",false));
}
function uniq(arr){return [...new Set(arr)];}
function open(s){
  if(s) location.hash = encodeURIComponent(s);
  document.querySelectorAll(".srow").forEach(r=>r.classList.toggle("on", r.dataset.s===s));
  const rows = bySub[s]||[];
  const lv = uniq(rows.map(r=>r.l).filter(Boolean)).sort();
  const pp = uniq(rows.map(r=>r.pp).filter(Boolean)).sort();
  const ks = uniq(rows.map(r=>r.k));
  const se = uniq(rows.map(r=>r.ses)).sort((a,b)=>sesKey(b)-sesKey(a));
  const opt=(arr,f)=>['<option value="">全部</option>'].concat(arr.map(v=>`<option>${esc(v)}</option>`)).join("");
  E("main").innerHTML =
   `<h2 style="margin:0 0 4px">${esc(s)}</h2><div class="hint">${rows.length} 份</div>
    <div class="bar">
      <select id="f1">${opt(lv)}</select>
      <select id="f2">${opt(pp)}</select>
      <select id="f3">${opt(ks.map(k=>k))}</select>
      <select id="f4">${opt(se)}</select>
      <button id="cl">清除筛选</button>
      <button id="rd">随机一套</button>
      <button id="qs">二维码小抄</button>
    </div>
    <div id="tbl"></div>`;
  const draw=()=>{
    const f1=E("f1").value,f2=E("f2").value,f3=E("f3").value,f4=E("f4").value;
    const rs=rows.filter(r=>(!f1||r.l===f1)&&(!f2||r.pp===f2)&&(!f3||r.k===f3)&&(!f4||r.ses===f4));
    CUR=rs;
    const kName={paper:"试卷",markscheme:"评分标准",report:"考官报告",specimen:"样卷"};
    E("tbl").innerHTML = `<div class="hint">显示 ${rs.length} 份</div><table><thead><tr><th>考季</th><th>层级</th><th>卷</th><th>TZ</th><th>类型</th><th>文件</th><th></th></tr></thead><tbody>`
      + rs.map((r,i)=>`<tr><td class="ses">${esc(r.ses)}</td><td class="hl">${esc(r.l)}</td><td>${esc(r.pp)}</td><td>${esc(r.tz)}</td><td><span class="tag ${r.k[0]}">${kName[r.k]||r.k}</span></td><td style="color:var(--mut);max-width:380px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(r.n)}">${esc(r.n)}</td><td style="white-space:nowrap"><button class="dl v" data-i="${i}">看</button> <a class="dl" href="${esc(r.u)}" target="_blank" rel="noopener">下载</a> ${msFor(r)?`<button class="dl q" data-i="${i}">MS 码</button>`:`<span class="tag">无 MS</span>`}</td></tr>`).join("")
      + `</tbody></table>`;
    E("tbl").querySelectorAll("button.q").forEach(b=>b.onclick=()=>showQR(CUR[+b.dataset.i]));
    E("tbl").querySelectorAll("button.v").forEach(b=>b.onclick=()=>window.openReader&&window.openReader(CUR[+b.dataset.i]));
  };
  ["f1","f2","f3","f4"].forEach(i=>E(i).onchange=draw);
  E("cl").onclick=()=>{["f1","f2","f3","f4"].forEach(i=>E(i).value="");draw();};
  E("qs").onclick=()=>openQrSheet(CUR,s);
  E("rd").onclick=()=>{const r=rows[Math.floor(Math.random()*rows.length)];window.open(r.u,"_blank");};
  draw();
}
function buildSubs(){
  E("subs").innerHTML = subList.map(s=>`<div class="srow" data-s="${esc(s)}"><span>${esc(s)}</span><span class="c">${bySub[s].length}</span></div>`).join("");
  document.querySelectorAll(".srow").forEach(r=>r.onclick=()=>open(r.dataset.s));
}
let tmr=null;
E("q").oninput = () => { clearTimeout(tmr); tmr=setTimeout(search, 180); };
function search(){
  const q=E("q").value.trim().toLowerCase();
  if(!q){cardView();return;}
  document.querySelectorAll(".srow").forEach(r=>r.classList.remove("on"));
  const hits=P.filter(r=>(r.s+" "+r.n+" "+r.l+" "+r.pp+" "+r.tz+" "+r.ses+" "+r.k).toLowerCase().includes(q));
  const cap=1200;
  const kName={paper:"试卷",markscheme:"评分标准",report:"考官报告",specimen:"样卷"};
  const mk=()=>kName[Object.keys(kName).find(k=>k.startsWith(hits[i].k[0]))];
  E("main").innerHTML = `<h2 style="margin:0 0 4px">搜索 “${esc(q)}”</h2><div class="hint">命中 ${hits.length} 份${hits.length>cap?`（只显示前 ${cap}）`:``}</div>
   <table><thead><tr><th>科目</th><th>考季</th><th>层级</th><th>卷</th><th>类型</th><th>文件</th><th></th></tr></thead><tbody>`
   + hits.slice(0,cap).map((r,i)=>`<tr><td>${esc(r.s)}</td><td class="ses">${esc(r.ses)}</td><td class="hl">${esc(r.l)}</td><td>${esc(r.pp)}</td><td><span class="tag ${r.k[0]}">${r.k==='markscheme'?'评分标准':r.k==='paper'?'试卷':r.k}</span></td><td style="color:var(--mut);max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(r.n)}">${esc(r.n)}</td><td><button class="dl v" data-i="${i}">看</button> <a class="dl" href="${esc(r.u)}" target="_blank" rel="noopener">下载</a></td></tr>`).join("")
   + `</tbody></table><footer>共 ${hits.length} 条命中。</footer>`;
  E("main").querySelectorAll("button.v").forEach(b=>b.onclick=()=>window.openReader&&window.openReader(hits[+b.dataset.i]));
}
E("qrclose").onclick=()=>E("qrmask").classList.remove("on");
E("qrmask").onclick=e=>{ if(e.target.id==="qrmask") E("qrmask").classList.remove("on"); };
buildSubs();
const _h = decodeURIComponent(location.hash.slice(1));
const _qp = new URLSearchParams(location.search).get("qr");
if(_qp && bySub[_qp]) openQrSheet(bySub[_qp], _qp);
else if(_h && bySub[_h]) open(_h); else cardView();
E("tot").textContent = P.length.toLocaleString();
</script>

};
var R=[

  $('rdrSave').onclick=saveAnn;
  $('rdrExport').onclick=function(){var b=new Blob([JSON.stringify(R.ann)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(R.name||'annotations')+'.json';a.click();flash('已导出 JSON');};
  $('rdrImportBtn').onclick=function(){$('rdrImport').click();};
  $('rdrImport').onchange=function(){var f=this.files[0];if(!f)return;var fr=new FileReader();fr.onload=function(){try{R.ann=JSON.parse(fr.result);saveAnn();$('rdrPages').querySelectorAll('canvas.ink').forEach(function(c){c.redraw&&c.redraw();});flash('已导入');}catch(e){alert('格式不对');}};fr.readAsText(f);};
  $('rdrCloud').onclick=function(){alert('云同步（用 Google 账号存批注）需要先配一个 Google OAuth Client ID；国内网络 Google 还被墙。\n现在批注存在本机浏览器（localStorage），可以「导出 JSON」自己备份/换设备导入。');};
  document.querySelectorAll('#rdrTools button[data-tool]').forEach(function(b){b.onclick=function(){R.tool=b.dataset.tool;document.querySelectorAll('#rdrTools button[data-tool]').forEach(function(x){x.classList.toggle('on',x===b);});};});
  document.querySelectorAll('#rdrTools .sw').forEach(function(b){b.onclick=function(){R.color=b.dataset.c;document.querySelectorAll('#rdrTools .sw').forEach(function(x){x.classList.toggle('on',x===b);});};});
  $('rdrTools').querySelector('button[data-tool="pen"]').classList.add('on');
  document.querySelector('#rdrTools .sw[data-c="'+COLORS[1]+'"]').classList.add('on');
  $('rdrUndo').onclick=undo;$('rdrClear').onclick=clearPage;
  $('rdrFS').onclick=function(){
    if(document.fullscreenElement){document.exitFullscreen();}
    else{$('rdr').requestFullscreen&&$('rdr').requestFullscreen();}
  };
  document.addEventListener('fullscreenchange',function(){$('rdrPages').classList.toggle('row',!!document.fullscreenElement);$('rdrFS').classList.toggle('on',!!document.fullscreenElement);});
  $('rdrSplit').onclick=async function(){
    var r={u:R.url};var msAll=null;
    // find current row's ms url via a global lookup set by openReader's caller
    msAll=window.__rdrMSurl;
    if(!msAll)return;
    var body=$('rdrBody');
    if(body.classList.contains('srow')){body.classList.remove('srow');$('rdrMSwrap').style.display='none';this.classList.remove('on');$('rdrPages').classList.remove('row');return;}
    $('rdrMSwrap').style.display='block';body.classList.add('srow');this.classList.add('on');
    $('rdrPages').classList.add('row');
    if(!R.msDoc){try{R.msDoc=await pdfjsLib.getDocument({url:proxyFor(msAll)}).promise;}catch(e){$('rdrMS').innerHTML='<div class="rdrhint">评分标准加载失败</div>';return;}}
    await build(R.msDoc,$('rdrMS'),msAll,false);
  };
  document.addEventListener('keydown',function(e){
    if(!$('rdr').classList.contains('on'))return;
    var t=e.target.tagName;if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT')return;
    var k=e.key.toLowerCase();
    if(k==='p'){R.tool='pen';document.querySelectorAll('#rdrTools button[data-tool]').forEach(function(x){x.classList.toggle('on',x.dataset.tool==='pen');});}
    else if(k==='e'){R.tool='eraser';document.querySelectorAll('#rdrTools button[data-tool]').forEach(function(x){x.classList.toggle('on',x.dataset.tool==='eraser');});}
    else if(k==='u'||(k==='z'&&(e.metaKey||e.ctrlKey))){undo();e.preventDefault();}
    else if('1234'.indexOf(k)>=0){R.color=COLORS[+k-1];document.querySelectorAll('#rdrTools .sw').forEach(function(x){x.classList.toggle('on',x.dataset.c===R.color);});}
    else if(k==='escape'){if(!document.fullscreenElement)closeReader();}
  });
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
</script>
<div id="rdr" class="rdr">
  <div class="rdrbar">
    <span class="t" id="rdrTitle">阅读器</span>
    <select id="rdrSec" title="大题 / 书目跳转"></select>
    <button id="rdrFS">⛶ 全屏(横向)</button>
    <button id="rdrSplit">答案并排</button>
    <span id="rdrTools" style="display:flex;gap:4px;align-items:center">
      <button data-tool="pen" title="笔 (P)">✏️</button>
      <button data-tool="eraser" title="橡皮 (E)">🧽</button>
      <button id="rdrUndo" title="撤销 (U / ⌘Z)">↶</button>
      <button id="rdrClear" title="清本页">🗑</button>
      <button class="sw" data-c="#111111" title="黑 (4)"></button>
      <button class="sw" data-c="#e4002b" title="红 (2)"></button>
      <button class="sw" data-c="#1e6fd9" title="蓝 (3)"></button>
      <button class="sw" data-c="#18a558" title="绿 (4)"></button>
    </span>
    <button id="rdrSave">保存批注</button>
    <button id="rdrExport">导出</button>
    <button id="rdrImportBtn">导入</button>
    <input id="rdrImport" type="file" accept="application/json" style="display:none">
    <button id="rdrCloud" title="Google 登录存批注">☁ 云同步</button>
    <button id="rdrOpen">↗ 新标签</button>
    <span id="rdrFlash"></span>
    <button id="rdrX" style="margin-left:auto">✕</button>
  </div>
  <div id="rdrBody" class="rdrbody">
    <div id="rdrPages"></div>
    <div id="rdrMSwrap" style="display:none"><div id="rdrMS"></div></div>
  </div>
</div>
</body>
</html>
